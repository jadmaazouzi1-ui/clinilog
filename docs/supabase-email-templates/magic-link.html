<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark">
<style>@media (prefers-color-scheme: dark){.cl-page{background:#000000!important}.cl-name{color:#F5F1E6!important}.cl-card{background:#111111!important;border-color:#6B6659!important}.cl-card p,.cl-card h1{color:#F5F1E6!important}.cl-eyebrow,.cl-muted{color:#B8B2A2!important}.cl-foot{color:#B8B2A2!important}}</style></head>
<body class="cl-page" style="margin:0;background:#FBF9F3;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111111">
<div style="max-width:520px;margin:0 auto;padding:32px 24px">
<p class="cl-name" style="margin:0 0 16px;font-size:15px;font-weight:600;color:#111111"><img src="https://www.cliniclogmd.com/icon-192.png" width="20" height="20" alt="" style="display:inline-block;vertical-align:-4px;border:0;margin-right:8px">ClinicLog MD</p>
<div class="cl-card" style="background:#FFFFFF;border:1px solid #DCD6C8;border-radius:6px;padding:24px">
<p class="cl-eyebrow" style="margin:0 0 4px;font-size:13px;color:#57534A">Sign in</p>
<h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:600;line-height:1.3;color:#111111">Your sign-in link</h1>
<p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#111111">Use this link to sign in to ClinicLog MD. It works once.</p>
<a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#9E7E38;color:#000000;text-decoration:none;padding:12px 20px;font-size:15px;font-weight:600;border-radius:4px">Sign in</a>
<p class="cl-muted" style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#57534A">If you did not ask to sign in, you can ignore this email.</p>
</div>
<p class="cl-foot" style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#57534A">ClinicLog MD, cliniclogmd.com. Independent student project. Not affiliated with or endorsed by Wake Forest University.</p>
</div></body></html>
